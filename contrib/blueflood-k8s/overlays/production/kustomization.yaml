resources:
  - ../../base
namespace: blueflood-prod
patchesStrategicMerge:
  - set-replicas.yaml
  - set-compute-resources.yaml
  - label-config-maps.yaml

# This tunes the sizes of the persistent volumes. I'd like to do strategic merge patching like above, but it looks like
# volumeClaimTemplates get replaced instead of merged, so I'd have to completely specify all the volumes again in the
# patch file. That's no good. Just use this more complex approach unless someone has a better idea.
# IMPORTANT: For the claim templates, this assumes the data volume is the first one listed. There's no better way to
# select a specific volume.
patchesJson6902:
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: cass-seed
  patch: |
    [{"op": "replace", "value": "10Gi", "path": "/spec/volumeClaimTemplates/0/spec/resources/requests/storage"}]
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: cass-non-seed
  patch: |
    [{"op": "replace", "value": "10Gi", "path": "/spec/volumeClaimTemplates/0/spec/resources/requests/storage"}]
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: es-master
  patch: |
    [{"op": "replace", "value": "10Gi", "path": "/spec/volumeClaimTemplates/0/spec/resources/requests/storage"}]
- target:
    version: v1
    kind: PersistentVolumeClaim
    name: graphite-data
  patch: |
    # Current prod Graphite has a 4TB data volume, which is 3/4 full, so...
    [{"op": "replace", "value": "4Ti", "path": "/spec/resources/requests/storage"}]

