# Here you can tune the CPU and RAM resources for all the pods.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cass-seed
spec:
  template:
    spec:
      containers:
        - name: cassandra
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: "0.5"
              memory: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cass-non-seed
spec:
  template:
    spec:
      containers:
        - name: cassandra
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: "0.5"
              memory: 2Gi
---
