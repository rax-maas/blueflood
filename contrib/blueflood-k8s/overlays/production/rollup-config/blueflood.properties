#ELASTICSEARCH_HOST_FOR_REST_CLIENT=10.184.12.238:9200,10.184.4.150:9200,10.184.4.151:9200,10.184.4.152:9200
ELASTICSEARCH_CLUSTERNAME=blueflood-es
#ELASTICSEARCH_IS_TYPELESS=true
ELASTICSEARCH_INDEX_NAME_WRITE=metric_metadata_write
ELASTICSEARCH_INDEX_NAME_READ=metric_metadata_read
ELASTICSEARCH_TOKEN_INDEX_NAME_WRITE=metric_tokens_write
ELASTICSEARCH_TOKEN_INDEX_NAME_READ=metric_tokens_read
MAX_DISCOVERY_RESULT_SIZE=10000

MAX_THREADS=10
MIN_THREADS=2

META_CACHE_RETENTION_IN_MINUTES=30

METADATA_CACHE_PERSISTENCE_ENABLED=true
METADATA_CACHE_PERSISTENCE_PATH=/var/cache/blueflood-rollup-metadata.cache
METADATA_CACHE_PERSISTENCE_PERIOD_MINS=10

META_CACHE_MAX_CONCURRENCY=50

# Setting this to true will enable batched meta reads and writes from db (lazy loads and writes)
META_CACHE_BATCHED_READS=false
META_CACHE_BATCHED_WRITES=false

METRICS_BATCH_WRITER_THREADS=100
MAX_WRITE_ACCEPT_THREADS=10
MAX_WRITE_WORKER_THREADS=50
MAX_READ_ACCEPT_THREADS=10
MAX_READ_WORKER_THREADS=50

# how many rows to read at a time? (batch size)
META_CACHE_BATCHED_READS_THRESHOLD=1000
# how often to read? (batch timer) (read faster than writes)
META_CACHE_BATCHED_READS_TIMER_MS=10
# how many outstanding batches? (1 thread per batch).
META_CACHE_BATCHED_READS_PIPELINE_DEPTH=10


# how many meta columns to write at a time? (batch size)
META_CACHE_BATCHED_WRITES_THRESHOLD=1000
# how often to write? (batch timer)
META_CACHE_BATCHED_WRITES_TIMER_MS=20
# how many outstanding batches? (1 thread per batch).
META_CACHE_BATCHED_WRITES_PIPELINE_DEPTH=10


# limits the maximum number of concurrent rollups that can be taking place. This number will vary, but should be
# kept reasonable. (values as high as 200 are not unreasonable, given suitable hardware.)
# if you find your system getting behind, but cores are not being fully utilized, follow this procedure:
# 1. if RollupServiceMBean.getQueuedRollupCount() is big, you need to increase MAX_ROLLUP_READ_THREADS.
MAX_ROLLUP_READ_THREADS=300
MAX_ROLLUP_WRITE_THREADS=30
MAX_LOCATOR_FETCH_THREADS=30
MAX_TIMEOUT_WHEN_EXHAUSTED=100

# cassandra request timeout length (in ms)
CASSANDRA_REQUEST_TIMEOUT=8000
CASSANDRA_MAX_RETRIES=10

METRIC_BATCH_SIZE=10

USE_ES_FOR_UNITS=false
TURN_OFF_RR_MPLOT=false
REPAIR_ROLLUPS_ON_READ=true

# Rollup On Read
ROLLUP_ON_READ_THREADS=50
ROLLUP_ON_READ_REPAIR_THREADS=250
ROLLUP_ON_READ_REPAIR_SIZE_PER_THREAD=5

# indicates how often the scheduler will scavenge for (shard,slots) that need to be rolled up.
SCHEDULE_POLL_PERIOD=30000

# identifies which data shards this node is responsible for. Value values are:
# 1. "ALL" indicates this node is responsible for rolling up all shards.
# 2. "NONE" indicates this node will not perform rollups. It is a read/write slave.
# 3. a comma-delimited list of integers (0-127). E.g.: "0,1,2,3,4,5,6,7"
SHARDS=ALL

# frequency at which shard state push/pull happens in milliseconds.
# pushes happen relatively quickly and should not be delayed.
SHARD_PUSH_PERIOD=2000

# since pulls take an order of magnitude longer than pushes, they should be spaced out.  The longer the period, the
# higher the probability that occasional extra 5m rollups will be scheduled.  Plan on at least 50ms per shard.  So if
# your node is managing 10 shards, it will take about 500ms to do a pull.
SHARD_PULL_PERIOD=10000

#GRAPHITE_HOST=10.223.243.97
GRAPHITE_PORT=2003
#GRAPHITE_PREFIX=rollup10.iad.blueflood.rollup
#XXX: add instance index to graphite prefix?


#string: address of riemann server where events should be sent.
#RIEMANN_HOST=10.208.128.52
RIEMANN_PORT=5555
#string: name of the server blueflood is running on.
RIEMANN_LOCALHOST=rollup10.iad.prod.bf.k1k.me
#string: separator between metric name components. if set to "|" would result in: prefix|metric_name|rate_5m
RIEMANN_SEPARATOR=.
#comma-delimited list of strings: tags to append to metric events. ex- blueflood,ingest
RIEMANN_TAGS=blueflood,rollup
#XXX: add instance index?
#string: prefix metric names with this. useful for telling metrics from backfiller vs normal BF instance. (RIEMANN_LOCALHOST and RIEMANN_TAGS are better though)
RIEMANN_PREFIX=rollup

# Temporary setting for one rollup window
APPLY_ROLLUP_PATCH=true
DROP_SLOTS_BEYOND_TS=0
ARE_TTLS_FORCED=false
TTL_CONFIG_CONST=5
# This is how long until we consider a metric to be delayed with the Tracker
TRACKER_DELAYED_METRICS_MILLIS=600000
# This is how long we wait until we a process slot has reached this age to process it
ROLLUP_DELAY_MILLIS=600000
# This is how long we wait until we re-roll slot
SHORT_DELAY_METRICS_ROLLUP_DELAY_MILLIS=7200000
LONG_DELAY_METRICS_ROLLUP_WAIT_MILLIS=1800000

# the granularity for which we store delayed metrics. Allowed values are 5m, 20m, 60m, 240m, 1440m
DELAYED_METRICS_STORAGE_GRANULARITY=20m
# the granularity upto which we re-roll only the delayed metrics instead of the entire shard. Allowed values are 5m, 20m, 60m, 240m, 1440m
DELAYED_METRICS_REROLL_GRANULARITY=60m
# Enabling this will record delayed metrics
RECORD_DELAYED_METRICS=true

# The earliest and latest differences from the current timestamp that blueflood will accept on ingestion data
BEFORE_CURRENT_COLLECTIONTIME_MS=259200000
AFTER_CURRENT_COLLECTIONTIME_MS=600000

# Feature to improve token search. Enabling this will persist metric name tokens separately.
ENABLE_TOKEN_SEARCH_IMPROVEMENTS=true

# Feature to track datapoints ingested for each tenant
ENABLE_PER_TENANT_METRICS=true

# each node can run one or more of INGEST, ROLLUP or QUERY services. This
# setting makes that obvious and explicit.
INGEST_MODE=false
ROLLUP_MODE=true
QUERY_MODE=false

# CORS response headers
# allowed origins can either be "*" for all, or a specific domain;  currently does not support glob or multiple origins
CORS_ENABLED=false
CORS_ALLOWED_ORIGINS=*
CORS_ALLOWED_METHODS=GET,POST
CORS_ALLOWED_HEADERS=X-Auth-Token,Accept
CORS_ALLOWED_MAX_AGE=1728000
