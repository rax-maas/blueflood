---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    component: ingest
spec:
  selector:
    matchLabels:
      component: ingest
  replicas: 2
  template:
    metadata:
      labels:
        component: ingest
    spec:
      volumes:
        - name: config-source
          configMap:
            name: ingest-config
      containers:
        - name: blueflood
          image: rackerlabs/blueflood:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: "0.5"
              memory: 2Gi
          volumeMounts:
            - name: config-source
              mountPath: /etc/blueflood
          env:
            - name: INIT_CASSANDRA
              value: 'false'
            - name: INIT_ELASTICSEARCH
              value: 'false'
            - name: BLUEFLOOD_CONF_LOCATION
              value: /etc/blueflood/blueflood.properties
            - name: BLUEFLOOD_LOG4J_CONF_LOCATION
              value: /etc/blueflood/blueflood-log4j.properties
            # Set to 'true' to enable remote debugging of the Blueflood process.
            - name: DEBUG_JAVA
              value: 'false'
            # Set to 'true' to have the Blueflood JVM wait for a debugger to attach before starting.
            - name: DEBUG_JAVA_SUSPEND
              value: 'false'
            # The default port value should work, but something's setting it to "tcp://<ip>:80"
            - name: GRAPHITE_PORT
              value: '2003'
            - name: GRAPHITE_PREFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              port: 19000
              path: /v2.0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24 # 24*5=120 == allow 2 minutes for startup
          livenessProbe:
            httpGet:
              port: 19000
              path: /v2.0
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              port: 19000
              path: /v2.0
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  labels:
    component: ingest
spec:
  ports:
    - name: http
      port: 19000
      protocol: TCP
  selector:
    component: ingest
